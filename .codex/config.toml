# Project-level configuration for Codex Command Line Interface.
# Project configuration is loaded from .codex/config.toml and merged with user config,
# with a defined precedence order. :contentReference[oaicite:1]{index=1}

approval_policy = "on-request"
sandbox = false


[mcp_servers.skilltester]
command = "python3"
args = ["-u", "/home/postnl/SkillTester/mcp_server.py"]
cwd = "/home/postnl/SkillTester"
enabled = true
startup_timeout_sec = 20
tool_timeout_sec = 60

[mcp_servers.skilltester.env]
PYTHONUNBUFFERED = "1"